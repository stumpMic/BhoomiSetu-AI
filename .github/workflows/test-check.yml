name: End-to-End System Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r machine-learning/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run system integration tests
        run: |
          python machine-learning/src/generate_data.py
          python machine-learning/src/train_classifier.py
          python machine-learning/src/train_regressor.py
          pytest tests/test_api_integration.py
